name: Publish to main

on:
  push:
    branches: [staged]

concurrency:
  group: publish-to-main
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: staged
          fetch-depth: 0

      - name: Extract Node version from package.json
        id: node-version
        run: |
          NODE_VERSION=$(jq -r '.engines.node // "22"' package.json)
          echo "version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Materialize plugin files
        run: node eng/materialize-plugins.mjs

      - name: Build generated files
        run: npm run build

      - name: Fix line endings
        run: bash scripts/fix-line-endings.sh

      - name: Publish to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f plugins/*/agents/ plugins/*/skills/
          git commit -m "chore: publish from staged" --allow-empty
          git push origin HEAD:main --force

      - name: Dispatch website deployment
        run: gh workflow run deploy-website.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
